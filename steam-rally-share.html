<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hadrian Spooner's Steam Rally Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--brass:#d4a437;--iron:#262320;--iron2:#38332e;--ox:#8c2a22;--bg:#1d1a17;--ink:#f2e6c9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1a17}}
:root[data-theme=dark]{--bg:#1d1a17}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',system-ui,sans-serif;overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px)}
#wrap{display:flex;flex-direction:column;height:100%}
#stage{position:relative;flex:1;min-height:0}
canvas{width:100%;height:100%;display:block}
#msg{position:absolute;left:0;right:0;top:118px;text-align:center;font-family:Rye,Georgia,serif;font-size:20px;color:#ffe9a8;text-shadow:0 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .3s}
#panel{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:repeating-linear-gradient(90deg,var(--iron) 0 38px,var(--iron2) 38px 40px);border-top:5px solid var(--brass)}
.steer{display:flex;gap:8px}
button{font:inherit;color:var(--ink);cursor:pointer}
.sb{width:68px;height:84px;border-radius:12px;border:3px solid var(--brass);background:#4a2b25;font-size:30px}
.sb:active,.sb.on{background:var(--ox)}
#shovel{width:112px;height:112px;border-radius:50%;border:5px double var(--brass);background:radial-gradient(circle at 35% 30%,#ff9a3c,#b5381c 60%,#5a1710);font-family:Rye,serif;font-size:17px;line-height:1.05;box-shadow:0 5px 0 #000}
#shovel:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.reg{display:flex;flex-direction:column;align-items:center;font-family:Rye,serif;font-size:12px;gap:4px}
#regs{writing-mode:vertical-lr;direction:rtl;height:92px;width:44px;accent-color:var(--brass)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,16,12,.72);padding:16px}
#card{max-width:420px;max-height:100%;overflow:auto;width:100%;padding:22px 22px 18px;background:var(--iron);border:5px double var(--brass);border-radius:6px;text-align:center;box-shadow:0 0 0 6px var(--ox)}
#card h1{font-family:Rye,Georgia,serif;font-weight:400;font-size:29px;line-height:1.05;margin:10px 0 4px;color:var(--brass)}
#card p{margin:8px 0;font-size:18px;line-height:1.3}
#card .k{font-size:15px;opacity:.75}
#go{margin-top:10px;padding:12px 22px;font-family:Rye,serif;font-size:19px;background:var(--ox);border:3px solid var(--brass);border-radius:8px}
#nm{padding:10px;border-radius:8px;border:3px solid var(--brass);background:var(--iron2);color:var(--ink);font:inherit;font-size:18px;width:100%;margin:8px 0 2px;user-select:text;-webkit-user-select:text}
.lbrow{text-align:left;font-size:16px;padding:3px 6px;border-bottom:1px solid #4a4540}.lbrow.me{background:var(--ox)}.lbh{font-family:Rye,serif;color:var(--brass);margin:12px 0 4px}#lbn{font-size:14px;opacity:.8}
#go2,#sub{margin:10px 0 0 6px;padding:12px 16px;font-family:Rye,serif;font-size:16px;background:var(--iron2);border:3px solid var(--brass);border-radius:8px}
#pic{position:relative;width:104px;margin:0 auto;border:4px double var(--brass);border-radius:52px 52px 6px 6px;overflow:hidden;box-shadow:0 0 0 4px var(--ox)}
#pic img{display:block;width:100%;height:128px;object-fit:cover;object-position:50% 20%}
#pic span{position:absolute;left:0;right:0;bottom:0;background:rgba(29,26,23,.85);color:var(--brass);font-family:Rye,serif;font-size:11px;padding:3px 0}
#veh{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
#veh button{flex:1;padding:8px 6px;border:3px solid #5a4a35;border-radius:8px;background:var(--iron2);font-family:Rye,serif;font-size:15px;line-height:1.1}
#veh button.on{border-color:var(--brass);background:var(--ox)}
#veh small{display:block;font-family:'Alegreya Sans',sans-serif;font-size:13px;margin-top:4px;opacity:.85}
#mbtn{position:absolute;left:10px;bottom:10px;width:42px;height:42px;border-radius:50%;border:3px solid var(--brass);background:var(--iron);font-size:20px;line-height:1;padding:0}
#mbtn.off{opacity:.5;text-decoration:line-through}
#sst{display:block;font-size:14px;margin-top:2px}#song{max-width:100%;font-size:13px}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
</style></head><body>
<div id="wrap">
 <div id="stage"><canvas id="c"></canvas><div id="msg"></div><button id="mbtn" aria-label="Music on or off">♪</button>
  <div id="ov"><div id="card"></div></div></div>
 <div id="panel">
  <div class="steer"><button class="sb" id="bl" aria-label="Steer left">◀</button><button class="sb" id="br" aria-label="Steer right">▶</button></div>
  <button id="shovel">Shovel<br>coal</button>
  <div class="reg"><input id="regs" type="range" min="0" max="100" value="0" aria-label="Regulator"><span>Regulator</span></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const LEN=24000,HW=92;let W=0,H=0;
function rs(){const d=Math.min(2,devicePixelRatio||1),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(rs).observe(cv);rs();
// ---- track
const cen=D=>{D=Math.max(0,D);return Math.min(1,D/500)*(0.55+0.45*Math.min(1,D/LEN))*(150*Math.sin(D/760)+85*Math.sin(D/310+1.1))};
const opt=D=>(cen(D-70)+cen(D)+cen(D+70))/3;
const hs=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const VH={eng:{sg:1.15,rt:3,ac:260,mu:1.8,hr:.7},roll:{sg:.6,rt:1.5,ac:250,mu:.8,hr:.45},car:{sg:1.5,rt:4.5,ac:330,mu:2,hr:1,bn:1.8}},pk=i=>1300+i*1300,pkx=i=>opt(pk(i))+(hs(i+40)-.5)*130,hz=i=>1650+i*1950,hzx=i=>opt(hz(i))+(hs(i+80)-.5)*60;let veh='eng',PD=0,PO=1;{let m=0;for(let D=9000;D<15000;D+=20){const k=Math.abs(cen(D-60)-2*cen(D)+cen(D+60));if(k>m){m=k;PD=D}}PO=(cen(PD-60)-2*cen(PD)+cen(PD+60))>0?-1:1}const OB={eng:{o:28,w:58,t:'paula'},roll:{o:28,w:58,t:'hut'},car:{o:46,w:62,t:'slick'}},pcx=()=>cen(PD)+PO*(HW-OB[veh].o);
// ---- state
let S,keys={},pL=0,pR=0,parts=[],best=+(localStorage.getItem&&0)||0,msgT=0,aud=null,chuff=0;
function reset(){S={st:'count',cd:3.4,boost:0,tent:0,gin:0,got:{},d:0,x:0,th:0,sa:0,sp:0,p:70,f:60,r:0,cool:0,choke:0,t:0,riv:0,rt:null,ls:0,ln:0,mud:false,flare:0,vent:0,wheel:0};parts=[];$('regs').value=0}
function msg(t,d=1.8){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity=0,d*1000)}
function snd(type){if(!aud)return;const t=aud.currentTime,n=aud.sampleRate*.1|0,b=aud.createBuffer(1,n,aud.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,type==='s'?1.2:3);
 const s=aud.createBufferSource(),f=aud.createBiquadFilter(),g=aud.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=type==='s'?1800:420;g.gain.value=type==='s'?.12:.2;s.connect(f);f.connect(g);g.connect(aud.destination);s.start(t)}
function shovel(){if(!S||S.st==='done'||S.cool>0)return;S.cool=.3;if(S.f>88){S.choke=1.6;msg('Fire choked — ease off the coal')}S.f=Math.min(100,S.f+14);S.flare=.4;
 for(let i=0;i<10;i++)parts.push({x:S.x+(Math.random()-.5)*20,D:S.d+10,vx:(Math.random()-.5)*60,vD:80+Math.random()*80,l:.6,m:.6,r:2,k:'s'});snd('s')}
// ---- whistle & music
function whistle(len){if(!aud)return;const t=aud.currentTime,g=aud.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.1);g.gain.setValueAtTime(.2,t+len-.3);g.gain.linearRampToValueAtTime(0,t+len);g.connect(aud.destination);
 [466,587,698].forEach((f,i)=>{const o=aud.createOscillator(),l=aud.createOscillator(),lg=aud.createGain();o.type='triangle';o.frequency.setValueAtTime(f*.92,t);o.frequency.linearRampToValueAtTime(f,t+.15);l.frequency.value=6+i;lg.gain.value=f*.006;l.connect(lg);lg.connect(o.frequency);o.connect(g);o.start(t);l.start(t);o.stop(t+len);l.stop(t+len)});
 const n=aud.createBufferSource(),nb=aud.createBuffer(1,aud.sampleRate*len|0,aud.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=nb;const bp=aud.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2500;const ng=aud.createGain();ng.gain.value=.05;n.connect(bp);bp.connect(ng);ng.connect(g);n.start(t)}
let mus=null,musOn=true,userBuf=null,musT=null,beat=0,nextT=0;
const NF=n=>440*Math.pow(2,(n-69)/12),CH=[[48,52,55],[53,57,60],[55,59,62]],PR=[0,0,1,1,0,0,2,0],LD=[0,4,7,4,5,9,7,4,2,5,7,5,4,2,0,-99];
function tone(f,t,d,type,v,fc){const o=aud.createOscillator(),g=aud.createGain(),fl=aud.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=fc;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(fl);fl.connect(g);g.connect(mus);o.start(t);o.stop(t+d+.02)}
function sched(){if(!mus)return;while(nextT<aud.currentTime+.3){const b=beat%4,c=CH[PR[Math.floor(beat/4)%8]],t=nextT;
 if(b%2===0)tone(NF(c[b?2:0]-12),t,.35,'triangle',.5,500);else c.forEach(n=>tone(NF(n),t,.18,'square',.07,1800));
 const l=LD[beat%16];if(l>-99)tone(NF(72+l),t,.3,'square',.05,2400);nextT+=.46;beat++}}
function stopMusic(){clearInterval(musT);if(mus){try{mus.src&&mus.src.stop()}catch(_){}mus.disconnect();mus=null}}
function startMusic(){stopMusic();if(!aud||!musOn)return;mus=aud.createGain();mus.gain.value=.35;mus.connect(aud.destination);
 if(userBuf){const s=aud.createBufferSource();s.buffer=userBuf;s.loop=true;s.connect(mus);s.start();mus.src=s;return}
 beat=0;nextT=aud.currentTime+.1;musT=setInterval(sched,100)}
$('mbtn').onclick=()=>{musOn=!musOn;$('mbtn').classList.toggle('off',!musOn);if(!musOn)stopMusic();else if(S.st!=='done'&&$('ov').style.display==='none')startMusic()};
// ---- input
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(!aud)try{aud=new AudioContext()}catch(_){}
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(!keys[e.code]&&(e.code==='Space'||e.code==='KeyE'))shovel();keys[e.code]=1});
addEventListener('keyup',e=>keys[e.code]=0);
function hold(id,set){const b=$(id);['pointerdown'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();set(1);b.classList.add('on')}));
 ['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>{set(0);b.classList.remove('on')}))}
hold('bl',v=>pL=v);hold('br',v=>pR=v);
$('shovel').addEventListener('pointerdown',e=>{e.preventDefault();if(!aud)try{aud=new AudioContext()}catch(_){};shovel()});
$('regs').addEventListener('input',e=>{if(S)S.r=e.target.value/100});
